# ────────────────────────────────────────────────────────────────
# GitHub Pages deploy — frontend (statik eksport)
#
# IZOH: Bu loyiha to'liq full-stack (NestJS + PostgreSQL + Redis +
# Telegram). GitHub Pages faqat STATIK saytlarni joylaydi — backend
# alohida serverda ishga tushirilishi kerak (Docker / Railway /
# Render / VPS). Ushbu workflow frontend UI'ni statik qilib Pages'ga
# joylaydi. Backend ishga tushgach NEXT_PUBLIC_API_URL o'rnatilsa,
# sayt to'liq ishlaydi.
#
# Pages'ni yoqish (bir marta): Repo → Settings → Pages →
# Source: "GitHub Actions"
# ────────────────────────────────────────────────────────────────
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm 11 (Node 24) — lockfile shu versiya bilan yaratilgan;
          # Node 22 (npm 10) da @emnapi optional deps EUSAGE xatosi beradi
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build static export
        env:
          EXPORT: "true"
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
