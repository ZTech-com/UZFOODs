# ═══════════════════════════════════════════════════════════════════
# Render.com Blueprint — UZFOODs Restoran Tizimi
#
# Ishga tushirish:
# 1. https://dashboard.render.com/new/blueprint
# 2. GitHub repo'ni bog'lang: ZTech-com/UZFOODs
# 3. Render avtomatik render.yaml'ni topadi va barchasini yaratadi
#
# XATOLIK TUSHUNTIRMASI:
# - runtime: docker → Dockerfile'dan image build qiladi
# - runtime: image  → tayyor image registry'dan oladi (bizga kerak emas)
# - dockerfilePath  → service level'da, image: ICHIDA emas
# ═══════════════════════════════════════════════════════════════════

services:
  - type: web
    name: uzfoods
    runtime: docker                  # Dockerfile'dan build (image emas!)
    dockerfilePath: ./Dockerfile     # Service level'da (image: ichida emas!)
    dockerContext: .                 # Build context — repo root
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: uzfoods-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false                  # Qo'lda kiriting
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false                  # Qo'lda kiriting
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: CORS_ORIGINS
        value: ""                    # Production'da backend frontend bilan bir xil origin'da
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  - name: uzfoods-db
    plan: free
    databaseName: uzfoods
    user: uzfoods
